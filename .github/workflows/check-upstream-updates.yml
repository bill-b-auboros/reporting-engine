name: Check OCA Upstream Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 19.0
          fetch-depth: 0

      - name: Add OCA upstream remote
        run: |
          git remote add upstream https://github.com/OCA/reporting-engine.git || true
          git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          # Get commits that exist in upstream but not in our fork
          NEW_COMMITS=$(git log HEAD..upstream/19.0 --oneline 2>/dev/null || echo "")
          
          if [ -n "$NEW_COMMITS" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "commit_count=$(echo "$NEW_COMMITS" | wc -l)" >> $GITHUB_OUTPUT
            # Save commits to file for the issue body
            echo "$NEW_COMMITS" > /tmp/new_commits.txt
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if updates found
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commits = fs.readFileSync('/tmp/new_commits.txt', 'utf8');
            const commitCount = '${{ steps.check.outputs.commit_count }}';
            
            const issueBody = `## 🔔 OCA Upstream Updates Available
            
            There are **${commitCount} new commit(s)** in the OCA upstream repository that are not in your fork.
            
            ### New Commits from OCA:
            \`\`\`
            ${commits}
            \`\`\`
            
            ### How to Sync:
            
            1. **Clone your fork locally:**
               \`\`\`bash
               git clone git@github.com:bill-b-auboros/reporting-engine.git
               cd reporting-engine
               git checkout 19.0
               \`\`\`
            
            2. **Add OCA as upstream (if not already added):**
               \`\`\`bash
               git remote add upstream https://github.com/OCA/reporting-engine.git
               git fetch upstream
               \`\`\`
            
            3. **Merge upstream changes:**
               \`\`\`bash
               git merge upstream/19.0
               # Or use rebase: git rebase upstream/19.0
               \`\`\`
            
            4. **Resolve conflicts (if any) and push:**
               \`\`\`bash
               git push origin 19.0
               \`\`\`
            
            5. **Update submodules in your projects:**
               \`\`\`bash
               cd /path/to/monthly_customer_statements
               git submodule update --remote oca_dependencies/reporting-engine
               git add oca_dependencies/reporting-engine
               git commit -m "Update reporting-engine submodule"
               git push
               \`\`\`
            
            ---
            *This issue was automatically created by GitHub Actions.*
            *Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.*`;
            
            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-updates'
            });
            
            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔔 OCA Upstream Updates Available (${commitCount} commits)`,
                body: issueBody,
                labels: ['upstream-updates', 'automated']
              });
            } else {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: issueBody,
                title: `🔔 OCA Upstream Updates Available (${commitCount} commits)`
              });
            }

      - name: No updates found
        if: steps.check.outputs.has_updates == 'false'
        run: echo "✅ Your fork is up to date with OCA upstream!"
